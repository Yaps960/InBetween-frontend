<app-header (menuToggle)="toggleMenu()" />

<main class="home-content">
</main>

@if (isMenuOpen) {
  <app-hamburger-menu (closeMenu)="toggleMenu()" />
}

@if (isFriendsListOpen) {
  <app-friends-list
    (selectFriend)="openChat($event)"
    (closeFriends)="toggleFriendsList()"
  />
}

<div
  class="chat-windows"
  [class.friends-open]="isFriendsListOpen"
>
  @for (friend of openChats; track friend; let first = $first) {
    <app-chatbox
      [friend]="friend"
      [class.first-chatbox]="first"
      (closeChat)="closeChat(friend)"
    />
  }
</div>

@if (authService.isSignedIn && !isFriendsListOpen) {
  <button
    class="friends-toggle"
    type="button"
    aria-label="Open friends list"
    [attr.aria-expanded]="isFriendsListOpen"
    (click)="toggleFriendsList()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="26"
      height="26"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    </svg>
  </button>
}
