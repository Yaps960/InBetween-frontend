
<section class="friends-panel" aria-label="Friends list">
  <header class="panel-header">
    <h2>Friends</h2>

    <button
      type="button"
      aria-label="Close friends list"
      (click)="closeFriends.emit()"
    >
      ×
    </button>
  </header>

  <div class="friends-content">
    @for (friend of friends; track friend) {
      <button
        class="friend-item"
        type="button"
        (click)="selectFriend.emit(friend)"
      >
        {{ friend }}
      </button>
    }
  </div>
</section>
