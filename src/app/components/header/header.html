
<header class="header">
  <div class="header-left">
    <button
      type="button"
      class="menu-button"
      aria-label="Open navigation menu"
      (click)="menuToggle.emit()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a href="/"q>
      InBetween
    </a>
  </div>

  <div class="header-search">
    <input
      type="search"
      placeholder="Search InBetween"
      aria-label="Search"
      [(ngModel)]="searchQuery"
      (keyup.enter)="submitSearch()"
    />
    <button
      type="button"
      class="search-button"
      aria-label="Submit search"
      (click)="submitSearch()"
    >
      Search
    </button>
  </div>

  <div class="header-right">
    @if (authService.isSignedIn) {
      <button
        type="button"
        class="post-button"
        (click)="postToggle.emit()"
      >
        +
      </button>

      <div class="profile-dropdown">
        <button
          type="button"
          class="dropdown-button"
          aria-label="Open profile menu"
          [attr.aria-expanded]="isDropdownOpen"
          (click)="dropdownToggle()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="26"
            height="26"
            viewBox="0 0 32 32"
            fill="#50328a"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M16 15.503A5.041 5.041 0 1 0 16 5.42a5.041 5.041 0 0 0 0 10.083zm0 2.215c-6.703 0-11 3.699-11 5.5v3.363h22v-3.363c0-2.178-4.068-5.5-11-5.5z"/>
          </svg>
        </button>

        @if (isDropdownOpen) {
          <div class="dropdown-menu">
            <button
              type="button"
              routerLink="/profile"
              (click)="dropdownToggle()"
            >
              Profile
            </button>

            <button
              type="button"
              (click)="authService.signOut()"
            >
              Log Out
            </button>
          </div>
        }
      </div>
    } @else {
      <button
        type="button"
        class="signup-button"
        routerLink="/signup"
      >
        Sign Up
      </button>

      <button
        type="button"
        class="login-button"
        routerLink="/signin"
      >
        Log In
      </button>
    }
  </div>
</header>
